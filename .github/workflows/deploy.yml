name: GitHub Pages 배포

# main 브랜치에 강의 HTML을 올리면 목록을 다시 만들어 사이트에 반영한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩만, 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 강의 목록 생성
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7
        with:
          # 파일별 마지막 수정 날짜를 git 기록에서 읽기 때문에 전체 이력이 필요하다.
          fetch-depth: 0

      - name: Node 준비
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: lectures.json 만들기
        run: node scripts/build-manifest.mjs

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude 'node_modules' \
            --exclude '_site' \
            --exclude '.gitignore' \
            --exclude 'lectures.order.txt' \
            ./ _site/
          touch _site/.nojekyll

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 사이트 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages로 배포
        id: deployment
        uses: actions/deploy-pages@v5
