<script>
/* 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다.
   저장된 선택이 있으면 그걸 쓰고, 없으면 운영체제 설정을 따른다. */
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<style>
/* ═══════════════════ 색상 토큰 ═══════════════════ */
:root,
:root[data-theme="dark"]{
  --bg:#0B0B0D;
  --bg-deep:#050506;
  --panel:#161619;
  --panel2:#1D1D22;
  --line:#2A2A2F;
  --line-soft:#1E1E23;
  --orange:#FF5B1F;
  --orange-hi:#FF8A57;
  --orange-soft:rgba(255,91,31,.12);
  --orange-bd:rgba(255,91,31,.38);
  --txt:#F3F2EF;
  --muted:#A2A2AB;
  --dim:#77777F;
  --shadow:0 18px 44px rgba(0,0,0,.45);
  --shadow-soft:0 2px 10px rgba(0,0,0,.28);
  --chip-txt:#FFFFFF;
  --field:#131316;
}
:root[data-theme="light"]{
  --bg:#FAF8F4;
  --bg-deep:#F2EEE6;
  --panel:#FFFFFF;
  --panel2:#F5F2EC;
  --line:#E2DCD1;
  --line-soft:#EDE9E1;
  --orange:#D8410E;
  --orange-hi:#B93509;
  --orange-soft:rgba(216,65,14,.07);
  --orange-bd:rgba(216,65,14,.30);
  --txt:#1A1815;
  --muted:#5F5A51;
  --dim:#8A857B;
  --shadow:0 18px 40px rgba(60,48,30,.13);
  --shadow-soft:0 2px 10px rgba(60,48,30,.08);
  --chip-txt:#FFFFFF;
  --field:#FFFFFF;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
  transition:background .25s ease,color .25s ease;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:3px;border-radius:6px}

.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ═══════════════════ 상단 바 ═══════════════════ */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.topbar .wrap{
  height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:11px;font-size:15px;min-width:0}
.brand .logo{width:20px;height:20px;flex:none;color:var(--orange)}
.brand b{font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--dim);font-weight:500;white-space:nowrap}
.brand i{font-style:normal;color:var(--line)}

.themebtn{
  display:flex;align-items:center;gap:8px;flex:none;
  height:38px;padding:0 15px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;
}
.themebtn:hover{border-color:var(--orange-bd);color:var(--txt)}
.themebtn svg{width:16px;height:16px;flex:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}
:root[data-theme="dark"] .themebtn .i-moon{display:none}
:root[data-theme="light"] .themebtn .i-sun{display:none}
:root[data-theme="light"] .themebtn .i-moon{display:block}

/* ═══════════════════ 히어로 ═══════════════════ */
.hero{padding:66px 0 40px;border-bottom:1px solid var(--line-soft)}
.eyebrow{
  display:inline-block;
  color:var(--orange);font-size:13px;font-weight:800;letter-spacing:.14em;
  background:var(--orange-soft);border:1px solid var(--orange-bd);
  padding:5px 13px;border-radius:20px;margin-bottom:20px;
}
.hero h1{
  font-size:clamp(30px,5.2vw,50px);
  line-height:1.22;font-weight:800;letter-spacing:-1.1px;
  margin-bottom:18px;max-width:19ch;
}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero .lead{
  font-size:clamp(15px,1.7vw,17.5px);color:var(--muted);
  line-height:1.72;max-width:62ch;
}
.hero .lead b{color:var(--txt);font-weight:700}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.stat{
  display:flex;align-items:baseline;gap:7px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 15px;
}
.stat b{font-size:19px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

/* ═══════════════════ 검색 · 정렬 ═══════════════════ */
.controls{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 26px;
  padding:30px 0 24px;
}
.field{flex:1 1 300px;min-width:0}
.field label{
  display:block;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  color:var(--dim);margin-bottom:8px;
}
.searchbox{position:relative}
.searchbox svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--dim);pointer-events:none;
}
#search{
  width:100%;height:46px;padding:0 44px 0 41px;
  background:var(--field);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);font-family:inherit;font-size:15px;
  transition:border-color .18s,box-shadow .18s;
}
#search::placeholder{color:var(--dim)}
#search:focus{outline:none;border-color:var(--orange-bd);box-shadow:0 0 0 3.5px var(--orange-soft)}
.clearbtn{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;display:none;place-items:center;
  background:none;border:0;border-radius:7px;color:var(--dim);cursor:pointer;font-size:17px;
}
.clearbtn:hover{background:var(--panel2);color:var(--txt)}
.clearbtn.on{display:grid}

.sorts{display:flex;gap:7px;flex-wrap:wrap}
.sorts button{
  height:46px;padding:0 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:all .18s;
}
.sorts button:hover{border-color:var(--orange-bd);color:var(--txt)}
.sorts button[aria-checked="true"]{
  background:var(--orange-soft);border-color:var(--orange-bd);color:var(--orange);
}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(322px,1fr));
  gap:16px;padding-bottom:14px;
}
.card{
  display:flex;flex-direction:column;gap:13px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:22px 23px 19px;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
  position:relative;height:100%;
}
.card:hover{transform:translateY(-3px);border-color:var(--orange-bd);box-shadow:var(--shadow)}
.card:active{transform:translateY(-1px)}

.card .head{display:flex;align-items:center;gap:11px}
.card .num{
  width:31px;height:31px;flex:none;border-radius:9px;
  display:grid;place-items:center;
  background:var(--orange);color:var(--chip-txt);
  font-size:14px;font-weight:800;
  font-family:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;
}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tagpill{
  font-size:11.5px;font-weight:800;letter-spacing:.02em;
  padding:3.5px 10px;border-radius:20px;
  background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange-bd);
  white-space:nowrap;
}
.recent{
  margin-left:auto;flex:none;
  font-size:11px;font-weight:800;letter-spacing:.03em;
  color:var(--dim);border:1px solid var(--line);
  padding:3.5px 9px;border-radius:20px;white-space:nowrap;
}

.card h2{
  font-size:19.5px;font-weight:800;letter-spacing:-.45px;line-height:1.4;
}
.card p{font-size:14.5px;color:var(--muted);line-height:1.62;flex:1}

.card .foot{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-top:13px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--dim);font-weight:600;
}
.card .foot .m{display:flex;align-items:center;gap:5.5px}
.card .foot svg{width:14px;height:14px;flex:none}
.card .go{
  margin-left:auto;color:var(--orange);font-weight:800;font-size:13px;
  display:flex;align-items:center;gap:5px;
}
.card:hover .go svg{transform:translateX(3px)}
.card .go svg{transition:transform .2s ease}

/* ═══════════════════ 상태 표시 ═══════════════════ */
.state{
  padding:56px 26px;text-align:center;
  border:1px dashed var(--line);border-radius:15px;
  color:var(--muted);
}
.state h3{font-size:18px;font-weight:800;color:var(--txt);margin-bottom:9px;letter-spacing:-.3px}
.state p{font-size:14.5px;line-height:1.7;max-width:52ch;margin:0 auto}
.state code{
  font-family:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;
  font-size:13px;background:var(--panel2);border:1px solid var(--line);
  padding:2px 7px;border-radius:6px;color:var(--orange);
}
.skeleton{
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
  height:186px;position:relative;overflow:hidden;
}
.skeleton::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--txt) 7%,transparent),transparent);
  transform:translateX(-100%);animation:shine 1.35s infinite;
}
@keyframes shine{to{transform:translateX(100%)}}

.notice{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--orange-soft);border:1px solid var(--orange-bd);
  border-radius:12px;padding:14px 18px;margin-bottom:20px;
  font-size:14px;color:var(--txt);line-height:1.65;
}
.notice svg{width:17px;height:17px;flex:none;color:var(--orange);margin-top:3px}

/* ═══════════════════ 푸터 ═══════════════════ */
.footer{
  margin-top:52px;padding:30px 0 46px;
  border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;
  font-size:13.5px;color:var(--dim);
}
.footer a{color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:1px}
.footer a:hover{color:var(--orange);border-color:var(--orange-bd)}
.footer .sep{margin-left:auto}

/* ═══════════════════ 반응형 ═══════════════════ */
@media (max-width:760px){
  .wrap{padding:0 18px}
  .hero{padding:44px 0 32px}
  .brand span,.brand i{display:none}
  .grid{grid-template-columns:1fr;gap:13px}
  .controls{padding:24px 0 20px;gap:16px}
  .field{flex:1 1 100%}
  .sorts{width:100%}
  .sorts button{flex:1;padding:0 10px;font-size:12.5px}
  .footer{margin-top:36px}
  .footer .sep{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

<main>
  <section class="hero">
    <div class="wrap">

<script>
'use strict';

/* ══════════════════════════ 테마 ══════════════════════════ */
const themeBtn = document.getElementById('themeBtn');
const themeLabel = document.getElementById('themeLabel');

function paintThemeButton() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeLabel.textContent = isDark ? '밝게' : '어둡게';
  themeBtn.setAttribute('aria-label', isDark ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
}
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) { /* 저장이 막힌 환경은 그냥 넘어간다 */ }
  paintThemeButton();
});
paintThemeButton();

/* ══════════════════════════ 도구 ══════════════════════════ */
const grid = document.getElementById('grid');
const statsBox = document.getElementById('stats');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const sortsBox = document.getElementById('sorts');
const noticeSlot = document.getElementById('noticeSlot');
const updatedAtBox = document.getElementById('updatedAt');
const repoLink = document.getElementById('repoLink');
const brandName = document.getElementById('brandName');

const RECENT_KEY = 'lastOpenedLecture';
let lectures = [];
let currentSort = 'order';

const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (ch) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
));

/** 2026-08-11T... → 2026.08.11 */
function formatDate(iso) {
  if (!iso) return '';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())}`;
}

/** 주소로 저장소 정보를 유추한다 (sudo0928.github.io/claude-code-master/) */
function guessRepo() {
  const host = location.hostname;
  if (!host.endsWith('github.io')) return null;
  const owner = host.replace(/\.github\.io$/, '');
  const firstSegment = location.pathname.split('/').filter(Boolean)[0];
  return { owner, repo: firstSegment || `${owner}.github.io` };
}

function showNotice(html) {
  noticeSlot.innerHTML = `<div class="notice"><svg><use href="#i-info"/></svg><div>${html}</div></div>`;
}

/* ══════════════════════ 목록 불러오기 ══════════════════════ */

/** 1순위: 빌드 때 만들어진 lectures.json */
async function loadManifest() {
  const response = await fetch(`lectures.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!response.ok) throw new Error(`매니페스트 응답 ${response.status}`);
  return response.json();
}

/**
 * 2순위: 저장소 파일 목록을 GitHub API로 직접 읽는다.
 * (빌드가 아직 안 돌았거나 실패했을 때를 위한 안전망)
 */
async function loadFromGitHubApi() {
  const repoInfo = guessRepo();
  if (!repoInfo) throw new Error('저장소 정보를 알 수 없음');

  const response = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/`);
  if (!response.ok) throw new Error(`GitHub API 응답 ${response.status}`);

  const files = (await response.json())
    .filter((item) => item.type === 'file'
      && item.name.endsWith('.html')
      && item.name !== 'index.html'
      && item.name !== '404.html'
      && !item.name.startsWith('_'));

  // 각 파일의 앞부분만 읽어 제목·태그를 뽑아본다 (실패하면 파일명으로 대체)
  const parsed = await Promise.all(files.map(async (file) => {
    const fallbackTitle = file.name
      .replace(/\.html$/, '').replace(/[-_]/g, ' ')
      .replace(/\b\w/g, (ch) => ch.toUpperCase());
    const base = { file: file.name, title: fallbackTitle, tags: [], description: '', slides: 0, updated: '' };
    try {
      const html = await (await fetch(file.name)).text();
      const pick = (re) => (html.match(re)?.[1] || '').replace(/<[^>]*>/g, ' ')
        .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
      const tagText = pick(/<div class="tag"[^>]*>([\s\S]*?)<\/div>/i);
      return {
        ...base,
        title: pick(/<title[^>]*>([\s\S]*?)<\/title>/i) || fallbackTitle,
        tags: tagText.split(/\s+/).filter(Boolean).map((t) => t.replace(/^#/, '')),
        description: pick(/<div class="sub"[^>]*>([\s\S]*?)<\/div>/i).split(/\s*·\s*/)[0] || '',
        slides: (html.match(/<section[^>]*class="[^"]*\bslide\b[^"]*"/gi) || []).length,
      };
    } catch (error) {
      return base;
    }
  }));

  parsed.forEach((lecture, index) => { lecture.order = index + 1; });
  return {
    series: '수업 자료',
    count: parsed.length,
    totalSlides: parsed.reduce((sum, item) => sum + item.slides, 0),
    lectures: parsed,
    fromApi: true,
  };
}

/* ══════════════════════════ 그리기 ══════════════════════════ */

function renderStats(manifest) {
  const latest = lectures
    .map((lecture) => lecture.updated).filter(Boolean).sort().pop();
  const items = [
    { value: manifest.count, unit: '개 강의' },
    { value: manifest.totalSlides, unit: '장 슬라이드' },
  ];
  if (latest) items.push({ value: formatDate(latest), unit: '마지막 업데이트' });

  statsBox.innerHTML = items
    .map((item) => `<div class="stat"><b>${escapeHtml(item.value)}</b><span>${item.unit}</span></div>`)
    .join('');
}

function cardHtml(lecture) {
  const recentFile = (() => {
    try { return localStorage.getItem(RECENT_KEY); } catch (e) { return null; }
  })();

  const tags = (lecture.tags || []).slice(0, 3)
    .map((tag) => `<span class="tagpill">#${escapeHtml(tag)}</span>`).join('');
  const isRecent = recentFile === lecture.file;
  const dateText = formatDate(lecture.updated) || lecture.date || '';

  return `
    <a class="card" href="${encodeURI(lecture.file)}" data-file="${escapeHtml(lecture.file)}">
      <div class="head">
        <span class="num">${String(lecture.order).padStart(2, '0')}</span>
        <span class="tags">${tags}</span>
        ${isRecent ? '<span class="recent">최근 열람</span>' : ''}
      </div>
      <h2>${escapeHtml(lecture.title)}</h2>
      <p>${escapeHtml(lecture.description || '수업에서 사용한 발표 자료입니다.')}</p>
      <div class="foot">
        ${lecture.slides ? `<span class="m"><svg><use href="#i-slides"/></svg>${lecture.slides}장</span>` : ''}
        ${dateText ? `<span class="m"><svg><use href="#i-clock"/></svg>${escapeHtml(dateText)}</span>` : ''}
        <span class="go">열기<svg><use href="#i-arrow"/></svg></span>
      </div>
    </a>`;
}

function render() {
  const keyword = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('on', keyword.length > 0);

  let visible = lectures.filter((lecture) => {
    if (!keyword) return true;
    const haystack = [
      lecture.title, lecture.description, lecture.file, (lecture.tags || []).join(' '),
    ].join(' ').toLowerCase();
    return haystack.includes(keyword);
  });

  visible = visible.slice().sort((a, b) => {
    if (currentSort === 'title') return a.title.localeCompare(b.title, 'ko');
    if (currentSort === 'updated') return String(b.updated).localeCompare(String(a.updated));
    return a.order - b.order;
  });

  if (!visible.length) {
    grid.style.gridTemplateColumns = '1fr';
    grid.innerHTML = `
      <div class="state">
        <h3>검색 결과가 없습니다</h3>
        <p>“${escapeHtml(searchInput.value.trim())}”와 맞는 강의를 찾지 못했습니다. 다른 낱말로 찾아보세요.</p>
      </div>`;
    return;
  }

  grid.style.gridTemplateColumns = '';
  grid.innerHTML = visible.map(cardHtml).join('');
}

/* ══════════════════════════ 이벤트 ══════════════════════════ */

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});

sortsBox.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-sort]');
  if (!button) return;
  currentSort = button.dataset.sort;
  sortsBox.querySelectorAll('button').forEach((el) => {
    el.setAttribute('aria-checked', String(el === button));
  });
  render();
});

// 마지막으로 연 강의를 기억해 카드에 표시해 준다
grid.addEventListener('click', (event) => {
  const card = event.target.closest('.card');
  if (!card) return;
  try { localStorage.setItem(RECENT_KEY, card.dataset.file); } catch (e) { /* 무시 */ }
});

// "/" 를 누르면 바로 검색창으로
document.addEventListener('keydown', (event) => {
  if (event.key === '/' && document.activeElement !== searchInput) {
    event.preventDefault();
    searchInput.focus();
  }
  if (event.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    render();
  }
});

/* ══════════════════════════ 시작 ══════════════════════════ */

(async function init() {
  let manifest = null;

  try {
    manifest = await loadManifest();
  } catch (manifestError) {
    try {
      manifest = await loadFromGitHubApi();
      showNotice('목록 파일을 읽지 못해 <b>GitHub에서 직접 파일 목록을 가져왔습니다.</b> 슬라이드 수 같은 정보가 빠져 보일 수 있습니다.');
    } catch (apiError) {
      grid.style.gridTemplateColumns = '1fr';
      grid.innerHTML = `
        <div class="state">
          <h3>강의 목록을 불러오지 못했습니다</h3>
          <p>
            이 페이지는 <code>lectures.json</code>을 읽어 목록을 만듭니다.
            내 컴퓨터에서 파일을 직접 열었다면 브라우저 보안 정책 때문에 목록을 읽을 수 없습니다.
            <br><br>
            폴더에서 <code>npx serve</code> 같은 간단한 서버를 띄우거나,
            <code>node scripts/build-manifest.mjs</code>로 목록을 다시 만든 뒤 확인해 주세요.
          </p>
        </div>`;
      updatedAtBox.textContent = '목록을 불러오지 못했습니다.';
      return;
    }
  }

  lectures = manifest.lectures || [];
  if (manifest.series) brandName.textContent = manifest.series;

  renderStats(manifest);
  render();

  updatedAtBox.textContent = manifest.generatedAt
    ? `목록 갱신: ${formatDate(manifest.generatedAt)} · 강의 파일을 올리면 자동으로 새 목록이 만들어집니다.`
    : '강의 파일을 올리면 자동으로 목록에 나타납니다.';

  const repoInfo = guessRepo();
  if (repoInfo) {
    repoLink.href = `https://github.com/${repoInfo.owner}/${repoInfo.repo}`;
    repoLink.hidden = false;
  }
})();
</script>
</body>
</html>
